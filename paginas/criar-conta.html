<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - CESC</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <!--
     Autor: Francisco Tchiama
     Companhia: TCLabs
     Data: 19/10/2026
     Versão: 1.0
     Descrição:
     Página de criação de conta para alunos do CESC.
     O aluno prova que é aluno através do BI (que já está em cesc.alunos).

     Como faz:
     - Pede BI, e-mail e password.
     - Chama a RPC cesc_criar_conta.
     - Se o BI existir em cesc.alunos, cria a conta.
     - Se não existir, mostra erro.

     Porque faz:
     - Só alunos matriculados (com BI registado) podem criar conta.
     - A conta fica ligada ao aluno pelo e-mail.
    -->

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icone"><i class="fas fa-user-plus"></i></div>
                <h1>Criar Conta</h1>
                <p>Registo exclusivo para alunos matriculados no CESC.</p>
            </div>

            <div id="form-registo">
                <div class="campo-grupo">
                    <label for="reg-bi">Número do BI</label>
                    <input type="text" id="reg-bi" placeholder="Ex: 000123456LA041" autocomplete="off">
                    <small style="color:#666; font-size:0.75rem;">O BI que consta na tua matrícula.</small>
                </div>

                <div class="campo-grupo">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" placeholder="teu@email.com" autocomplete="email">
                </div>

                <div class="campo-grupo">
                    <label for="reg-password">Palavra-passe</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>

                <div class="campo-grupo">
                    <label for="reg-password-2">Confirmar palavra-passe</label>
                    <input type="password" id="reg-password-2" placeholder="Repete a password" autocomplete="new-password">
                </div>

                <button id="btn-criar-conta" class="botao-primario w-100">Criar conta</button>
                <p id="msg-erro-reg" class="auth-erro"></p>
                <p id="msg-sucesso-reg" class="auth-info" style="display:none; background: #d1fae5; border-color: #10b981; color: #065f46;"></p>
            </div>

            <div class="auth-footer">
                <p>Já tens conta? <a href="login.html">Entrar</a></p>
                <p>Não encontras o teu BI? <a href="contacto.html">Contacta a secretaria</a>.</p>
            </div>
        </div>
    </div>
 <script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
</body>
</html>
