<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Aluno — CESC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/perfil-aluno.css">
</head>
<body class="dashboard-body" style="background-color: #f1f5f9;">

    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p>A carregar o perfil do aluno...</p>
    </div>

    <main class="container" id="perfil-conteudo" style="display: none; padding: 24px 0; max-width: 1100px;">
        
        <div style="display:flex; justify-content:flex-start; align-items:center; margin-bottom: 16px;">
            <a href="#" id="btn-voltar" class="botao-secundario" style="padding: 8px 16px;">
                <i class="fas fa-arrow-left"></i> Voltar atrás
            </a>
        </div>

        <!-- Capa e Avatar -->
        <div class="perfil-capa">
            <div class="perfil-header-conteudo">
                <div class="perfil-avatar-grande" id="perf-avatar">?</div>
                <div class="perfil-info-principal">
                    <h1 id="perf-nome">A carregar...</h1>
                    <p id="perf-bi">BI: —</p>
                    <span class="perfil-badge-estado" id="perf-estado">Activo</span>
                </div>
            </div>
        </div>

        <!-- Grelha de Conteúdo -->
        <div class="perfil-grelha" style="margin-top: 20px;">
            
            <!-- COLUNA ESQUERDA -->
            <div>
                <div class="perfil-card">
                    <h3><i class="fas fa-info-circle"></i> Sobre o Aluno</h3>
                    <div id="perf-sobre"></div>
                </div>

                <div class="perfil-card">
                    <h3><i class="fas fa-history"></i> Linha do Tempo</h3>
                    <div id="perf-historico"></div>
                </div>

                <!-- Cartões Colapsáveis -->
                <div class="perfil-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; border:none; padding:0;"><i class="fas fa-file-alt"></i> Documentos</h3>
                        <button class="btn-toggle-card btn-acao btn-acao-secundario" style="font-size:0.75rem; padding:4px 8px;">Ver</button>
                    </div>
                    <div id="perf-documentos" class="docs-grelha toggle-conteudo" style="display:none; margin-top:16px; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
                </div>

                <div class="perfil-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; border:none; padding:0;"><i class="fas fa-user-clock"></i> Faltas</h3>
                        <button class="btn-toggle-card btn-acao btn-acao-secundario" style="font-size:0.75rem; padding:4px 8px;">Ver</button>
                    </div>
                    <div id="perf-faltas" class="toggle-conteudo" style="display:none; margin-top:16px;"></div>
                </div>

                <div class="perfil-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; border:none; padding:0;"><i class="fas fa-money-bill-wave"></i> Pagamentos</h3>
                        <button class="btn-toggle-card btn-acao btn-acao-secundario" style="font-size:0.75rem; padding:4px 8px;">Ver</button>
                    </div>
                    <div id="perf-pagamentos" class="toggle-conteudo" style="display:none; margin-top:16px;"></div>
                </div>

                <div class="perfil-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; border:none; padding:0;"><i class="fas fa-edit"></i> Alterações</h3>
                        <button class="btn-toggle-card btn-acao btn-acao-secundario" style="font-size:0.75rem; padding:4px 8px;">Ver</button>
                    </div>
                    <div id="perf-historico-alt" class="toggle-conteudo" style="display:none; margin-top:16px;"></div>
                </div>
            </div>

            <!-- COLUNA DIREITA -->
            <div>
                <!-- Barra de Filtros Global -->
                <div class="perfil-card" style="padding:12px 16px; display:flex; justify-content:flex-end; gap:12px; align-items:center; background:transparent; border:none; box-shadow:none; margin-bottom:0;">
                    <label style="font-size:0.85rem; font-weight:600; color:var(--cor-texto-suave);">Filtrar por:</label>
                    <select id="filtro-ano" class="campo-select" style="width:auto; padding:6px 12px; font-size:0.85rem; border:1px solid var(--cor-borda); border-radius:6px; font-weight:bold; color:var(--cor-azul);">
                        <!-- Preenchido via JS -->
                    </select>
                    <select id="filtro-trimestre" class="campo-select" style="width:auto; padding:6px 12px; font-size:0.85rem; border:1px solid var(--cor-borda); border-radius:6px; font-weight:bold; color:var(--cor-azul);">
                        <option value="1">1º Trimestre</option>
                        <option value="2">2º Trimestre</option>
                        <option value="3">3º Trimestre</option>
                    </select>
                </div>

                <div class="perfil-card">
                    <h3><i class="fas fa-school"></i> Situação no Ano</h3>
                    <div id="perf-turma"></div>
                </div>

                <div class="perfil-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom: 1px solid var(--cor-borda); padding-bottom: 8px;">
                        <h3 style="margin:0; border:none; padding:0;"><i class="fas fa-chart-line"></i> Notas</h3>
                    </div>
                    <div id="perf-notas" style="overflow-x:auto;"></div>
                </div>
            </div>

        </div>
    </main>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/perfil-aluno.js"></script>
</body>
</html>
