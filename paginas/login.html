<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - CESC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
<link rel="icon" type="image/png" href="../favicon.png"></head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icone"><i class="fas fa-graduation-cap"></i></div>
                <h1>Área Reservada</h1>
                <p>Acesso exclusivo para alunos e professores do CESC.</p>
            </div>

            <!-- PASSO 1 -->
            <div id="passo-1">
                <div class="campo-grupo">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" placeholder="teu@email.com" autocomplete="email">
                </div>
                <div class="campo-grupo">
                    <label for="login-password">Palavra-passe</label>
                    <input type="password" id="login-password" placeholder="A tua password" autocomplete="current-password">
                </div>
                <button id="btn-enviar-codigo" class="botao-primario w-100">Receber código de acesso</button>
                <p id="msg-erro-1" class="auth-erro"></p>
            </div>

            <!-- PASSO 2 -->
            <div id="passo-2" style="display:none;">
                <p class="auth-info">
                    Enviámos um código de 6 dígitos para <strong id="email-mostrado">-</strong>.
                    Abre o teu e-mail e insere o código abaixo.
                </p>
                <div class="campo-grupo">
                    <label for="login-codigo">Código de verificação</label>
                    <input type="text" id="login-codigo" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                </div>
                <button id="btn-validar-codigo" class="botao-primario w-100">Entrar</button>
                <button id="btn-reenviar-codigo" class="btn-reenviar">Não recebeste o código? Reenviar</button>
                <button id="btn-voltar" class="botao-secundario w-100" style="margin-top:8px;">Voltar</button>
                <p id="msg-erro-2" class="auth-erro"></p>
            </div>

            <div class="auth-footer">
                <p>Ainda não tens conta? <a href="criar-conta.html">Criar conta</a></p>
                <p>Problemas com o acesso? <a href="contacto.html">Contacta a secretaria</a>.</p>
            </div>
        </div>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/auth.js"></script>
</body>
</html>
